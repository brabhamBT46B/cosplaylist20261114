      let camCount = 0;
      let assCount = 0;

      EVENT_DATA.forEach(sec => {
        if (sec.type === 'cosplayer') cosCount += sec.members.length;
        if (sec.type === 'camera') camCount += sec.members.length;
        if (sec.type === 'assistant') assCount += sec.members.length;
      });

      const total = cosCount + camCount + assCount;
      document.getElementById('count-cosplayer').textContent = cosCount;
      document.getElementById('count-camera').textContent = camCount;
      document.getElementById('count-assistant').textContent = assCount;
      document.getElementById('total-counter').textContent = total;
      document.getElementById('checked-counter').textContent = checkedSet.size;
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('category-tabs');
      const allTabs = [
        { id: 'all', label: 'すべて' },
        ...EVENT_DATA.map(sec => ({ id: sec.id, label: sec.title.replace('地方', '') }))
      ];

      tabsContainer.innerHTML = allTabs.map(tab => {
        const isActive = activeCategory === tab.id;
        return `
          <button
            data-tab="${tab.id}"
            class="tab-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold transition ${
              isActive
                ? 'bg-amber-400 text-slate-900 shadow-sm'
                : 'bg-slate-700/70 text-slate-200 hover:bg-slate-600'
            }"
          >
            ${tab.label}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.tab;
          renderTabs();
          renderList();
        });
      });
    }

    function copyTextToClipboard(text) {
      const tempInput = document.createElement('input');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(`@${text} をコピーしました`);
      } catch (e) {
        console.error('Copy failed', e);
      }
      document.body.removeChild(tempInput);
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    function toggleCheck(key) {
      if (checkedSet.has(key)) {
        checkedSet.delete(key);
      } else {
        checkedSet.add(key);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedSet]));
      document.getElementById('checked-counter').textContent = checkedSet.size;
      renderList();
    }

      let totalVisibleSections = 0;

      const html = EVENT_DATA.map(section => {
        if (activeCategory !== 'all' && activeCategory !== section.id) {
          return '';
        }

        const filteredMembers = section.members
          .map((m, idx) => ({ ...m, originalIndex: idx }))
          .filter(m => {
            if (!q) return true;
            return (
              m.chara.toLowerCase().includes(q) ||
              m.name.toLowerCase().includes(q) ||
              m.xId.toLowerCase().includes(q) ||
              section.title.toLowerCase().includes(q)
            );
          });

        if (filteredMembers.length === 0) return '';
        totalVisibleSections++;

        const cardsHtml = filteredMembers.map(member => {
          const memberKey = getMemberKey(section.id, member, member.originalIndex);
          const isChecked = checkedSet.has(memberKey);
          const cleanId = member.xId.replace(/^@/, '');
          const isMaleLayer = member.name.startsWith('★');

          let roleBadge = '';
          if (section.type === 'camera') {
            roleBadge = `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md bg-cyan-100 text-cyan-800"><i class="fa-solid fa-camera"></i> カメラマン</span>`;
          } else if (section.type === 'assistant') {
            roleBadge = `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800"><i class="fa-solid fa-headset"></i> アシスタント</span>`;
          } else {
            roleBadge = `<span class="inline-block text-xs font-extrabold px-2.5 py-0.5 rounded-md ${section.accentBg} text-slate-800 border ${section.borderColor}">${member.chara}</span>`;
          }

          return `
            <div class="relative bg-white rounded-2xl border ${isChecked ? 'card-checked' : 'border-slate-200/90'} p-3.5 shadow-xs hover:shadow-md transition flex flex-col justify-between gap-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  ${roleBadge}
                  ${isMaleLayer ? '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">★男性</span>' : ''}
                </div>

                <button
                  onclick="toggleCheck('${memberKey}')"
                  aria-label="合流・撮影チェック"
                  class="w-7 h-7 rounded-full flex items-center justify-center border transition shrink-0 ${
                    isChecked
                      ? 'bg-emerald-500 border-emerald-500 text-white shadow-xs'
                      : 'bg-slate-50 border-slate-300 text-slate-300 hover:border-emerald-400 hover:text-emerald-400'
                  }"
                >
                  <i class="fa-solid fa-check text-xs"></i>
                </button>
              </div>

              <div>
                <div class="text-base font-bold text-slate-900 leading-snug ${isChecked ? 'line-through text-slate-500' : ''}">
                  ${member.name}
                </div>
              </div>

              <div class="pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                <a
                  href="https://x.com/${encodeURIComponent(cleanId)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="inline-flex items-center gap-1.5 text-xs font-mono font-semibold text-slate-600 hover:text-sky-600 truncate transition"
                >
                  <i class="fa-brands fa-x-twitter text-slate-800"></i>
                  <span class="truncate">@${cleanId}</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-60"></i>
                </a>

                <button
                  onclick="copyTextToClipboard('${cleanId}')"
                  class="text-[11px] text-slate-400 hover:text-slate-700 px-2 py-1 rounded-lg hover:bg-slate-100 transition shrink-0"
                  title="IDをコピー"
                >
                  <i class="fa-regular fa-copy"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section class="scroll-mt-36">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2.5">
                <span class="px-3 py-1 rounded-full text-xs font-black tracking-wide shadow-xs ${section.badgeColor}">
                  ${section.title}
                </span>
                <span class="text-xs font-bold text-slate-500">
                  ${filteredMembers.length}名
                </span>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join('');

      if (totalVisibleSections === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        container.innerHTML = html;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateSummaryCounts();
      renderTabs();
      renderList();

      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        clearBtn.classList.toggle('hidden', searchQuery.length === 0);
        renderList();
      });

      clearBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        renderList();
      });

      const modal = document.getElementById('confirm-modal');
      document.getElementById('reset-checks').addEventListener('click', () => {
        if (checkedSet.size === 0) {
          showToast('チェック済みの項目はありません');
          return;
        }
        modal.classList.remove('hidden');
      });

      document.getElementById('modal-cancel').addEventListener('click', () => {
        modal.classList.add('hidden');
      });

      document.getElementById('modal-confirm').addEventListener('click', () => {
        checkedSet.clear();
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById('checked-counter').textContent = '0';
        modal.classList.add('hidden');
        renderList();
        showToast('チェックをリセットしました');
      });
    });
  </script>
</body>
</html>
